<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" rx="28" fill="#f5efe5"/><text x="60" y="62" fill="#49372d" font-family="Georgia,serif" font-size="30">From a spark to a publish-ready story</text><text x="60" y="94" fill="#8a7465" font-family="Arial,sans-serif" font-size="16">A guided workflow — each stage remains editable and reviewable.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="55" y="160" width="190" height="150" rx="18" fill="#fffaf2" stroke="#d9cabb"/><circle cx="150" cy="205" r="22" fill="#b96f52"/><text x="150" y="212" fill="#fff" font-size="20">01</text><text x="150" y="255" fill="#49372d" font-size="19" font-weight="bold">Your idea</text><text x="150" y="281" fill="#8a7465" font-size="14">Topic · notes · brief</text></g><g><rect x="285" y="160" width="190" height="150" rx="18" fill="#fffaf2" stroke="#d9cabb"/><circle cx="380" cy="205" r="22" fill="#b96f52"/><text x="380" y="212" fill="#fff" font-size="20">02</text><text x="380" y="255" fill="#49372d" font-size="19" font-weight="bold">Research</text><text x="380" y="281" fill="#8a7465" font-size="14">Sources · evidence</text></g><g><rect x="515" y="160" width="190" height="150" rx="18" fill="#fffaf2" stroke="#d9cabb"/><circle cx="610" cy="205" r="22" fill="#b96f52"/><text x="610" y="212" fill="#fff" font-size="20">03</text><text x="610" y="255" fill="#49372d" font-size="19" font-weight="bold">Outline & draft</text><text x="610" y="281" fill="#8a7465" font-size="14">Structure · sections</text></g><g><rect x="745" y="160" width="190" height="150" rx="18" fill="#fffaf2" stroke="#d9cabb"/><circle cx="840" cy="205" r="22" fill="#b96f52"/><text x="840" y="212" fill="#fff" font-size="20">04</text><text x="840" y="255" fill="#49372d" font-size="19" font-weight="bold">Review & refine</text><text x="840" y="281" fill="#8a7465" font-size="14">Citations · SEO · edit</text></g><g><rect x="975" y="160" width="170" height="150" rx="18" fill="#49372d"/><circle cx="1060" cy="205" r="22" fill="#c98768"/><text x="1060" y="212" fill="#fff" font-size="20">05</text><text x="1060" y="255" fill="#fffaf2" font-size="19" font-weight="bold">Publish</text><text x="1060" y="281" fill="#e6d6c7" font-size="14">Export · WordPress</text></g></g><g stroke="#b98b72" stroke-width="3" fill="none" stroke-linecap="round"><path d="M250 235h28m-8 -8 8 8-8 8M480 235h28m-8 -8 8 8-8 8M710 235h28m-8 -8 8 8-8 8M940 235h28m-8 -8 8 8-8 8"/></g><text x="60" y="378" fill="#8a7465" font-family="Arial,sans-serif" font-size="15">Human review stays in the loop. AI assistance does not replace source verification.</text></svg>